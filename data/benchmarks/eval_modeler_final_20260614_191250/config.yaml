# configs/remarl_train_fast.yaml
# ─────────────────────────────────────────────────────────────
# Fast training config: all agents on llama-3.2-3b (~3 sec/call).
# 50 episodes × 18 steps × 3 sec ≈ 45 min per role, ~2.5h for all 3.
# After training, evaluate with remarl_config.yaml (better models).
# ─────────────────────────────────────────────────────────────

project:
  name: "REMARL"
  version: "0.1.0"
  seed: 42

# ── All agents on fastest accessible NVIDIA model ─────────────
llm:
  provider: "nvidia"
  base_url: "https://integrate.api.nvidia.com/v1"
  model: "meta/llama-3.2-3b-instruct"
  temperature: 0.2
  max_tokens: 512
  agent_models:
    stakeholder: "meta/llama-3.2-3b-instruct"
    collector:   "meta/llama-3.2-3b-instruct"
    modeler:     "meta/llama-3.2-3b-instruct"
    checker:     "meta/llama-3.2-3b-instruct"
    documenter:  "meta/llama-3.2-3b-instruct"
    negotiator:  "meta/llama-3.2-3b-instruct"
  agent_max_tokens:
    stakeholder: 256
    collector:   384
    modeler:     256
    checker:     384
    documenter:  1024   # reduced for speed; documenter not trained
    negotiator:  384

# ── State encoder ──────────────────────────────────────────────
state_encoder:
  model: "all-MiniLM-L6-v2"
  state_dim: 1544

# ── Reward engine (same weights) ──────────────────────────────
reward:
  clarity_weight: 0.30
  consistency_weight: 0.40
  coverage_delta_weight: 0.30
  oracle_coverage_weight: 0.50
  oracle_precision_weight: 0.20
  oracle_conflict_weight: 0.15
  oracle_nfr_weight: 0.15
  step_penalty: 0.01
  coverage_threshold: 0.65

# ── Simulation environment ─────────────────────────────────────
env:
  scenario_dir: "data/scenarios/"
  max_steps_per_episode: 18
  hide_fraction: 0.25

# ── PPO — tuned for 50 episodes ──────────────────────────────
ppo:
  learning_rate: 3.0e-4
  n_steps: 36         # 2 episodes per PPO update → 25 updates over 50 episodes
  batch_size: 18
  n_epochs: 10
  gamma: 0.95
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.02
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_arch: [256, 256]

# ── Training loop ──────────────────────────────────────────────
training:
  n_episodes: 50
  eval_every_n_episodes: 10
  save_every_n_episodes: 25
  checkpoint_dir: "data/checkpoints/"
  log_dir: "data/logs/"
  early_stop_reward: 0.85
  agent_roles:
    - "collector"
    - "modeler"
    - "checker"

# ── Evaluation (use remarl_config.yaml for full eval) ─────────
eval:
  n_episodes: 20
  domains:
    - "e_commerce_marketplace"
    - "patient_portal"
    - "online_learning_platform"
    - "fleet_management"
  compare_against_baseline: true

# ── Episode memory ─────────────────────────────────────────────
memory:
  db_path: "data/episodes.db"
  max_episodes_stored: 10000
  prune_older_than_days: 30

# ── Wandb ─────────────────────────────────────────────────────
wandb:
  enabled: false
  project: "remarl"
  entity: null
